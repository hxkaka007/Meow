# 启动、渲染、资源兜底等基础冒烟。
# 期望值支持：直接写值 / '> 0' / '>= 36' / 初始 +1 / 增加 / 减少 / 不变 / 非空 / 为空
默认:
  种子: 42

用例:
  - 名称: 启动落在主页，资源齐全且无弹窗
    # 不写「进入」也不写「步骤」时，只断言启动后的初始状态
    期望:
      场景: 主页
      弹窗: 空
      脚本错误: 空
      控制台错误数: 0
      缺失资源数: 0

  - 名称: 第 5 关渲染 60 帧不报错
    进入: 对局
    关卡: 5
    步骤:
      - 推进: 60
    期望:
      场景: 对局
      对局状态: 进行中
      剩余方块: 36
      脚本错误: 空

  - 名称: 全部图片加载失败仍能渲染并报出缺失清单
    启动参数:
      图片全部失败: 是
    进入: 对局
    关卡: 61
    步骤:
      - 推进: 60
    期望:
      脚本错误: 空
      控制台错误数: 0
      缺失资源数: '> 0'

  - 名称: 首次启动排队两个每日奖励弹窗且道具已入账
    启动参数:
      跳过每日奖励: 否
    步骤:
      - 推进: 1
    期望:
      弹窗: 非空
      存档提示道具数: 2
      脚本错误: 空

  - 名称: 缺图时排队的重试定时器可执行且按虚拟时钟推进不报错
    启动参数:
      图片全部失败: 是
    步骤:
      - 执行定时器: ~
      - 推进: 60
    期望:
      缺失资源数: '> 0'
      控制台错误数: 0
      脚本错误: 空

  - 名称: 窄屏尺寸下对局渲染与道具点击仍不报错
    启动参数:
      宽度: 320
      高度: 480
    进入: 对局
    关卡: 1
    步骤:
      - 点击道具: 提示
      - 推进: 5
    期望:
      提示道具数: 初始 -1
      控制台错误数: 0
      脚本错误: 空

  - 名称: 指定起始时间启动仍按虚拟日期发放每日奖励
    启动参数:
      起始时间: '2026-06-01T08:00:00+08:00'
      跳过每日奖励: 否
    步骤:
      - 推进: 1
    期望:
      弹窗: 非空
      存档提示道具数: 2
      脚本错误: 空
