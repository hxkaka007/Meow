# 道具、弹窗流程与炸弹选格。
# 步骤是「动作名: 参数」的单键写法，动作名和按钮名见 _fields.yaml。
默认:
  种子: 42

用例:
  - 名称: 点击提示道具会扣库存并落盘
    进入: 对局
    关卡: 1
    步骤:
      - 点击道具: 提示
    期望:
      提示道具数: 初始 -1
      存档提示道具数: 初始 -1
      脚本错误: 空

  - 名称: 限时关使用加时道具增加时间
    进入: 对局
    关卡: 1
    步骤:
      - 点击道具: 加时
    期望:
      剩余时间: '> 200'
      加时道具数: 初始 -1
      脚本错误: 空

  - 名称: 不限时关的加时按钮被禁用，点击不扣道具
    进入: 对局
    关卡: 31
    步骤:
      - 点击道具: 加时
    期望:
      加时道具数: 不变
      脚本错误: 空

  - 名称: 暂停 -> 商店 -> 买提示 -> 关闭回到暂停
    进入: 对局
    关卡: 1
    步骤:
      - 点击顶栏: 暂停
      - 推进: 1
      - 点击弹窗按钮: 商店
      - 推进: 1
      - 点击弹窗按钮: 买提示
      - 推进: 1
      - 点击弹窗按钮: 关闭商店
      - 推进: 1
    期望:
      结算弹窗: 暂停中
      喵币: 初始 -50
      存档提示道具数: 初始 +1
      脚本错误: 空

  - 名称: 炸弹选格后点棋盘引爆会扣除道具
    进入: 对局
    关卡: 1
    步骤:
      - 点击道具: 炸弹
      - 点击格子: [0, 0]
      - 推进: 1
    期望:
      炸弹道具数: 初始 -1
      剩余方块: 减少
      脚本错误: 空
