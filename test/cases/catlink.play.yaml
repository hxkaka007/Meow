# 连连看端到端：自动通关、配对、结算。
# 「初始」指进入场景、渲染一帧之后的状态，所以期望值不用写死具体数字。
默认:
  种子: 42

用例:
  - 名称: 第 1 关真实触摸自动通关并写入进度
    进入: 对局
    关卡: 1
    步骤:
      - 自动通关: 触摸
      - 推进: 10
    期望:
      对局状态: 胜利
      结算弹窗: 胜利
      剩余方块: 0
      分数: '> 0'
      已解锁关卡: 初始 +1
      喵币: 增加
      点击次数: '>= 36'
      脚本错误: 空

  - 名称: 61 关双限关卡逻辑层自动通关
    进入: 对局
    关卡: 61
    步骤:
      - 自动通关: 逻辑
    期望:
      对局状态: 胜利
      剩余方块: 0
      脚本错误: 空

  - 名称: 11 关混合冰块与翻面按真实规则通关
    进入: 对局
    关卡: 11
    步骤:
      - 自动通关: 真实规则
    期望:
      对局状态: 胜利
      剩余方块: 0
      脚本错误: 空

  - 名称: 消除一对后方块减 2 且分数增加
    进入: 对局
    关卡: 1
    步骤:
      - 消除一对: 触摸
      - 推进: 5
    期望:
      剩余方块: 初始 -2
      分数: '> 0'
      脚本错误: 空
